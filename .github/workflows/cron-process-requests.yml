name: Trigger Process Requests Cron

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call Next.js Cron Endpoint
        run: |
          ADMIN_URL="${{ secrets.NEXT_PUBLIC_ADMIN_URL }}"
          if [ -z "$ADMIN_URL" ]; then
            ADMIN_URL="https://nexiplay-admin.vercel.app"
          fi
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$CRON_SECRET" ]; then
            CRON_SECRET="nexiplay_novel_sync_2026"
          fi
          curl -s -X POST "$ADMIN_URL/api/cron/process-requests" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"

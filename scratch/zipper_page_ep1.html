        .container {

        @keyframes slideUp {

        .shield-icon {

            align-items: center;

            background: rgba(255, 255, 255, 0.03);

            color: var(--primary);
            box-shadow: 0 0 30px rgba(0, 242, 234, 0.15);
            animation: pulse 2s infinite;
        }

        .shield-icon svg {
            width: 40px;
            height: 40px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 234, 0.2); }
            70% { box-shadow: 0 0 0 15px rgba(0, 242, 234, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 234, 0); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background: rgba(0, 242, 234, 0.1);
            border: 1px solid rgba(0, 242, 234, 0.2);
            border-radius: 20px;
            color: var(--primary);
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px var(--primary);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        h2 {
            margin: 0 0 10px;
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            margin: 0 0 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95em;
            line-height: 1.6;
        }

        .ignore-notice {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid rgba(255, 165, 0, 0.2);
            color: #ffb84d;
            font-size: 0.85em;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: inline-block;
        }

        .timer-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
        }

        .timer-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 5s linear;
            box-shadow: 0 0 10px var(--primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1em;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer; /* changed from allowed to pointer for better UX feel, controlled by JS */
            pointer-events: none;
            opacity: 0.6;
        }
        
        .btn span { margin-right: 10px; }

        .btn.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            background: var(--primary);
            color: #000; /* Contrast text for bright button */
            box-shadow: 0 5px 30px rgba(0, 242, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 242, 234, 0.5);
        }

        .footer-info {
            margin-top: 25px;
            font-size: 0.7em;
            color: rgba(255,255,255,0.15);
            font-family: monospace;
        }
    </style>
</head>
